# localsaml settings for the SAML Conformance Test Kit (run.sh passes the port and base URL).
# The kit plays two service providers, described by its own SP metadata, which is copied from
# the kit's image into samlconf-sp-metadata.xml.

# The kit expects a second service provider's login in the same session to complete without the
# login page, as a production IdP's would. localsaml shows the page by default.
silent_sso = true

[[service_providers]]
entity_id = "https://samlhost:8993/services/saml"
metadata_file = "samlconf-sp-metadata.xml"

# The kit's second SP signs with DSA (DSA-SHA1 and DSA-SHA256), which localsaml verifies like any
# other signature, so it's declared from the same metadata, certificate included.
[[service_providers]]
entity_id = "https://samlhostdsa:8994/services/samldsa"
metadata_file = "samlconf-sp-metadata.xml"

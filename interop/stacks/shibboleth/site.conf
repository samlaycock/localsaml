# The harness reaches Apache as http://localhost:9412 (published port), and Shibboleth builds its
# ACS and SLO URLs from the canonical name, so they must match what localsaml posts to.
ServerName http://localhost:9412
UseCanonicalName On
<VirtualHost *:80>
  ServerName http://localhost:9412
  UseCanonicalName On
  DocumentRoot /var/www/html
  <Location /secure>
    AuthType shibboleth
    ShibRequestSetting requireSession 1
    Require shib-session
  </Location>
  <Location /enc/secure>
    AuthType shibboleth
    ShibRequestSetting requireSession 1
    Require shib-session
  </Location>
  ErrorLog /dev/stderr
  LogLevel warn
</VirtualHost>

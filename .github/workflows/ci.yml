name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow dispatches CI on the release pull request's branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  audit:
    name: Audit (RustSec advisories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Ignored advisories, with reasons, are in .cargo/audit.toml.
      - run: cargo audit

  interop:
    name: Interop (node-saml, samlify, pysaml2, crewjam/saml, Shibboleth SP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interop/package-lock.json
      # pysaml2, crewjam/saml and Shibboleth SP run in Docker. Their images are built here with the
      # GitHub Actions cache (one scope per image) and loaded for run.mjs, which then skips building.
      - uses: docker/setup-buildx-action@v3
      - name: Build the pysaml2 image
        uses: docker/build-push-action@v6
        with:
          context: interop/stacks/pysaml2
          tags: localsaml-interop-pysaml2:latest
          load: true
          cache-from: type=gha,scope=interop-pysaml2
          cache-to: type=gha,mode=max,scope=interop-pysaml2
      - name: Build the crewjam/saml image
        uses: docker/build-push-action@v6
        with:
          context: interop/stacks/crewjam
          tags: localsaml-interop-crewjam:latest
          load: true
          cache-from: type=gha,scope=interop-crewjam
          cache-to: type=gha,mode=max,scope=interop-crewjam
      - name: Build the Shibboleth SP image
        uses: docker/build-push-action@v6
        with:
          context: interop/stacks/shibboleth
          tags: localsaml-interop-shibboleth:latest
          load: true
          cache-from: type=gha,scope=interop-shibboleth
          cache-to: type=gha,mode=max,scope=interop-shibboleth
      - run: cargo build
      - run: npm ci
        working-directory: interop
      # --require-stacks fails rather than skipping the Docker stacks if Docker isn't there;
      # --no-image-build uses the images built above.
      - run: npm test -- --no-build --no-image-build --require-stacks
        working-directory: interop

  conformance:
    name: SAML Conformance Test Kit (codice)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      # Fails on any failure not listed in interop/codice/expected-failures.tsv.
      - run: ./run.sh
        working-directory: interop/codice
        env:
          BINARY: ${{ github.workspace }}/target/debug/localsaml

  docker:
    name: Docker build and smoke test (no push)
    # Only release pull requests: the image is only published from them.
    if: github.ref_name == 'changeset-release/main' || github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: localsaml:smoke
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64
      # Start it the way the README shows (a mounted config) and check it answers.
      - run: scripts/docker-smoke.sh localsaml:smoke

  changeset:
    name: Changeset present
    # The release pull request consumes changesets rather than adding one.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check for a changeset
        run: |
          if ! npx changeset status --since="origin/${{ github.base_ref }}"; then
            echo "::error::This pull request needs a changeset. Run 'npm run changeset' (or 'npm run changeset -- --empty' for changes users won't notice)."
            exit 1
          fi
